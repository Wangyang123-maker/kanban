<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1623"><link rel="manifest" href="manifest.json">
<title>零售数据看板</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px 16px;background:#0f1623;color:#e8eef7;font:14px/1.6 -apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto}.logo{font-size:24px;font-weight:700}.sub{color:#8b98aa;margin:4px 0 24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{display:block;padding:18px;background:#182234;border:1px solid #25334d;border-radius:10px;color:#e8eef7;text-decoration:none}.card:hover{border-color:#2dd4bf}.card b{display:block;font-size:16px}.card span{display:block;color:#8b98aa;font-size:12px;margin-top:4px}.note{margin-top:18px;padding:14px;background:#2a2118;border:1px solid #4d3b25;border-radius:10px;color:#e8c98a;font-size:12px}.foot{margin-top:22px;color:#55637a;font-size:11px}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<div class="logo">零售数据看板</div>
<div class="sub">静态数据快照 · 手机和电脑均可访问</div>
<div class="grid">
<a class="card" href="retail.html"><b>零售总览</b><span>月度销售、门店和核心指标</span></a>
<a class="card" href="inventory.html"><b>库存查询</b><span>门店、SPU、SKU 分级查询</span></a>
<a class="card" href="stock.html"><b>库存分析</b><span>库存结构与明细</span></a>
<a class="card" href="demo.html"><b>样机管理</b><span>闲置、陈列及主机动销分类</span></a>
<a class="card" href="target.html"><b>目标看板</b><span>月度目标与完成情况</span></a>
<a class="card" href="insights.html"><b>经营分析</b><span>零售和库存分析</span></a>
</div>
<div class="note">这是公开静态快照入口。数据更新后需要重新发布；Excel 上传和自动计算请使用实时管理地址。</div>
<div class="foot" id="foot">加载发布信息中…</div>
</main><script>
fetch('release.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(v)document.querySelector('#foot').textContent='快照更新时间：'+v.updated+' · 数据校验：'+v.checksumStatus}).catch(()=>{document.querySelector('#foot').textContent='静态快照入口'})
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
