<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据上传 · 管理入口</title>
<link rel="stylesheet" href="apple.css?v=20260822-public1">
<style>
  body{min-height:100vh;padding:24px;display:grid;place-items:center}
  main{width:min(680px,100%);background:#fff;border:1px solid var(--border);border-radius:8px;padding:32px;box-shadow:var(--shadow)}
  h1{font-size:24px;margin-bottom:12px}.lead{color:var(--text-soft);font-size:15px;line-height:1.8}
  .notice{margin:22px 0;padding:16px;background:var(--primary-soft);border-left:3px solid var(--primary);color:var(--text-soft);line-height:1.7}
  .actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;padding:10px 16px;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>公开站点为只读模式</h1>
  <p class="lead">任何人都可以查看已发布的数据，但不能上传文件、修改目标或调整商品目录。</p>
  <div class="notice">数据管理员请在运行数据服务的电脑上打开本地上传页。上传并处理完成后，再执行公开快照同步。</div>
  <div class="actions"><a class="btn" href="http://127.0.0.1:8017/upload.html">在数据主机打开上传页</a><a class="btn ghost" href="index.html">返回零售看板</a></div>
</main>
</body>
</html>
