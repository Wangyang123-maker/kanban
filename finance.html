<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>库存金额与毛利</title>
<style>
body{padding:16px;min-height:100vh}.nav{display:flex;align-items:center;flex-wrap:wrap}.nav a{text-decoration:none;font-size:13px}.auto-sw{margin-left:auto;font-size:12px}.header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}.header h1{font-size:24px;margin:0}.meta{font-size:12px}.kpis{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kpi{padding:14px}.label{font-size:12px}.value{font-size:23px;font-weight:700;margin:5px 0;font-variant-numeric:tabular-nums}.sub{font-size:11px}.card{padding:14px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 10px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools input,.tools select{padding:7px 9px;font-size:12px;min-height:34px}.tools input{min-width:250px;flex:1}.tag{font-size:11px;font-weight:400;margin-left:8px}.table-wrap{overflow:auto;max-height:620px}.table-wrap table{min-width:1120px;width:100%;border-collapse:collapse;font-size:12px}.table-wrap th{position:sticky;top:0;z-index:1;padding:9px 8px;text-align:left;white-space:nowrap}.table-wrap td{padding:8px;vertical-align:middle}.num{text-align:right}.muted{color:#6e6e73}.status{font-size:11px;color:#6e6e73;margin-left:auto}.pill{display:inline-block;padding:3px 7px;border-radius:10px;font-size:11px;background:#e8f5ec;color:#248a3d}.pill.wait{background:#fff4e5;color:#a15c00}.cat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.cat{padding:10px;border:1px solid #e5e5ea;border-radius:8px}.cat .name{font-size:12px;color:#6e6e73}.cat .amt{font-size:17px;font-weight:700;margin-top:4px}.foot{text-align:center;font-size:11px;margin:16px}@media(max-width:860px){body{padding:10px}.kpis{grid-template-columns:repeat(2,1fr)}.cat-grid{grid-template-columns:repeat(2,1fr)}.tools input{min-width:100%}.header h1{font-size:21px}}
</style>
<link rel="stylesheet" href="apple.css?v=20260727-theme2">
<script src="public-runtime.js?v=20260822-public1"></script>
</head>
<body>
<nav class="nav">
<a href="index.html">零售看板</a><a href="inventory.html">库存看板</a><a href="stock.html">库存查询</a><a href="finance.html" class="cur">库存金额</a><a href="product.html">商品分析</a><a href="sales.html">产品销售</a><a href="insights.html">经营分析</a><a href="target.html?v=20260727-entry2">达成看板</a><a href="launch.html">新品首销</a><a href="demo.html">样机管理</a><a href="upload.html?v=20260727-entry2">手动上传</a><a href="guide.html">使用指南</a>
</nav>
<header class="header"><div><h1>库存金额与毛利</h1><div class="meta" id="meta">读取库存快照中…</div></div><div class="status" id="status"></div></header>
<section class="kpis" id="kpis"></section>
<section class="card"><h2>主机库存结构<span class="tag">默认不含配件；金额仅汇总有真实成本记录的 SKU</span></h2><div class="cat-grid" id="cats"></div></section>
<section class="card"><h2>SKU 库存金额明细<span class="tag">库存成本=可售库存×考核成本；预估毛利=可售库存×（参考售价−考核成本）</span></h2><div class="tools"><select id="cat"><option value="">全部品类</option></select><select id="match"><option value="">全部成本状态</option><option value="matched">已匹配成本</option><option value="missing">待补成本</option></select><input id="keyword" type="search" placeholder="搜索 SPU、SKU 或商品名称"><label class="muted"><input id="accessories" type="checkbox"> 含配件及其他</label><span class="status" id="count"></span></div><div class="table-wrap"><table><thead><tr><th>品类</th><th>SPU</th><th>SKU</th><th>商品名称</th><th class="num">可售库存</th><th class="num">近4周销量</th><th class="num">单台成本</th><th class="num">参考售价</th><th class="num">库存成本</th><th class="num">预估毛利</th><th class="num">毛利率</th><th>成本来源</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div class="foot">成本来源：7月体验店+非体侧产品政策指引；未收录 SKU 回退到最新零售明细中的同 SKU 考核成本 ｜ 无真实成本记录的 SKU 不计入金额合计</div>
<script>
let DATA=null;const yuan=v=>v==null?'—':'¥'+Math.round(v).toLocaleString('zh-CN');const pct=v=>v==null?'—':v.toFixed(1)+'%';const n=v=>Math.round(v||0).toLocaleString('zh-CN');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(!DATA)return;const s=DATA.summary;document.getElementById('meta').textContent='库存快照 '+(DATA.snapshotAt||'—')+' ｜ 已按政策表校正 SKU 分类与 SPU';const cards=[['可售库存',n(s.stockUnits)+' 件','主机及已选范围'],['库存成本',yuan(s.stockCost),'已匹配 '+n(s.matchedUnits)+' 件'],['预估零售额',yuan(s.stockValue),'政策最低价 / 销售参考价'],['预估毛利',yuan(s.expectedGross),'毛利率 '+pct(s.grossRate)],['成本匹配率',pct(s.matchedRate),n(s.matchedSkuCount)+' / '+n(s.skuCount)+' 个 SKU']];document.getElementById('kpis').innerHTML=cards.map((x,i)=>`<div class="kpi"><div class="label">${x[0]}</div><div class="value ${i===3?'up':i===4?'accent':''}">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('');document.getElementById('cats').innerHTML=DATA.cats.map(c=>`<div class="cat"><div class="name">${esc(c.cat)}</div><div class="amt">${yuan(c.stockCost)}</div><div class="muted">${n(c.stock)} 件 ｜ 已匹配 ${n(c.matched)} SKU</div></div>`).join('');const sel=document.getElementById('cat'),keep=sel.value;sel.innerHTML='<option value="">全部品类</option>'+DATA.cats.map(c=>`<option>${esc(c.cat)}</option>`).join('');sel.value=keep;filter();}
function filter(){if(!DATA)return;const cat=document.getElementById('cat').value,match=document.getElementById('match').value,q=document.getElementById('keyword').value.trim().toLowerCase();const rows=DATA.rows.filter(r=>(!cat||r.cat===cat)&&(!match||(match==='matched'?r.matched:!r.matched))&&(!q||[r.spu,r.sku,r.name].some(v=>String(v||'').toLowerCase().includes(q))));document.getElementById('count').textContent='显示 '+n(rows.length)+' / '+n(DATA.rows.length)+' 个 SKU';document.getElementById('rows').innerHTML=rows.map(r=>`<tr><td>${esc(r.cat)}</td><td>${esc(r.spu)}</td><td>${esc(r.sku)}</td><td>${esc(r.name)}</td><td class="num">${n(r.stock)}</td><td class="num">${n(r.sold28)}</td><td class="num">${yuan(r.unitCost)}</td><td class="num">${yuan(r.minPrice)}</td><td class="num">${yuan(r.stockCost)}</td><td class="num ${r.expectedGross<0?'down':'up'}">${yuan(r.expectedGross)}</td><td class="num">${pct(r.grossRate)}</td><td>${r.matched?'<span class="pill">'+esc(r.costSource||'已匹配')+'</span>':'<span class="pill wait">待补成本</span>'}</td></tr>`).join('')||'<tr><td colspan="12" class="muted">没有符合条件的 SKU</td></tr>';}
async function load(){const status=document.getElementById('status');status.textContent='加载中…';try{const r=await fetch('/api/finance-inventory?accessories='+(document.getElementById('accessories').checked?'1':'0'),{cache:'no-store'});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'加载失败');DATA=d;render();status.textContent='已更新'}catch(e){status.textContent='加载失败：'+e.message;document.getElementById('rows').innerHTML='<tr><td colspan="12">数据加载失败，请刷新重试</td></tr>';}}
['cat','match','keyword'].forEach(id=>document.getElementById(id).addEventListener(id==='keyword'?'input':'change',filter));document.getElementById('accessories').addEventListener('change',load);load();
</script>
</body></html>
